# ==============================================================================
# VMDK Import → GCE 作成 設定ファイル
# ==============================================================================
# `gcloud migration vms image-imports create` で VMDK をカスタムイメージ化し、
# そのイメージから GCE インスタンスを作成するための設定。
#
# 想定フロー:
#   1) GCS 上の VMDK を `gcloud migration vms image-imports create` でカスタムイメージ化
#      (非同期。`gcloud migration vms image-imports describe` で進捗確認)
#   2) （データディスクがある場合）同様にイメージ化 (--skip-os-adaptation)
#   3) カスタムイメージから `gcloud compute instances create` で GCE 作成
#   4) （データディスクがある場合）追加ディスクを作成して attach
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 共通設定 (Global)
# ------------------------------------------------------------------------------
global:
  # 出力先 GCP プロジェクト（image / instance / disk が作られる先）
  project_id: "shingo-ar-sharedservice0926-1"

  # GCE / イメージを作る region と zone
  region: "asia-northeast1"
  zone: "asia-northeast1-a"

  # ログ出力先
  log_dir: "./logs"
  log_file: "vmdk_import.log"

  # ドライランモード (true なら gcloud を実行せずコマンドを表示のみ)
  dry_run: true

  # 詳細ログ
  verbose_logging: true

# ------------------------------------------------------------------------------
# 2. ソース VMDK (Source Images)
# ------------------------------------------------------------------------------
# import 対象の VMDK。OS ディスクは boot: true とする。
# 複数ディスク構成の場合は disks: 配下に追加する。
source:
  disks:
    - name: "boot"                                # 任意の識別子（image 名のサフィックスにも使う）
      boot: true
      gcs_uri: "gs://shingo-ar-sharedhost0926/vmware_images/CentOS_8.4.2105_VMM_LinuxVMImages.COM.vmdk"

    # データディスクがある場合は以下のように追加（不要なら削除可）
    # - name: "data1"
    #   boot: false
    #   gcs_uri: "gs://REPLACE_ME/path/to/data1.vmdk"

# ------------------------------------------------------------------------------
# 3. イメージ import 設定 (gcloud migration vms image-imports create)
# ------------------------------------------------------------------------------
image_import:
  # 作成するカスタムイメージ名のプレフィックス
  # 実際の image 名 / import resource 名は "<prefix>-<source.disks[].name>" になる
  # 例) vmdk-imported-20260608-boot
  image_name_prefix: "vmdk-imported-20260608"

  # ライセンスタイプ (省略可、boot disk のみ有効)
  # compute-engine-license-type-byol / -payg / -default
  # license_type: "compute-engine-license-type-default"

  # target project 指定 (省略時はカスタマープロジェクト=global.project_id)
  # Migration host project と target project が異なる構成の場合のみ両方指定。
  # target_project_host: "vm-migration-host-project"
  # target_project_name: "target-project-id"

  # データディスクのみの import かどうかは、source.disks[].boot で判定する。
  # boot: false の disk は `--skip-os-adaptation` 付きで import される。

# ------------------------------------------------------------------------------
# 4. GCE インスタンス設定
# ------------------------------------------------------------------------------
instance:
  name: "centos8-from-vm"

  # マシンタイプ。元 VM の vCPU/メモリに合わせて選ぶ。
  # 既定スペックに合わない場合は custom-<vCPU>-<MEM_MB> を指定する。
  # 例: "n2-custom-4-16384" / "n2-standard-4" / "e2-standard-2"
  machine_type: "n2-standard-2"

  # ブートディスク
  boot_disk:
    # 種別: pd-balanced / pd-ssd / pd-standard / hyperdisk-balanced 等
    type: "pd-balanced"
    # サイズ(GB)。未指定ならイメージサイズに自動で合わせる。
    # 指定した値がイメージ実サイズより小さい場合も実サイズに自動引き上げされる。
    # 拡張したい場合のみ明示指定する。
    # size_gb: 50
    # 自動削除（インスタンス削除時にブートディスクも削除するか）
    auto_delete: true

  # 追加ディスク (source.disks の boot: false 分をここで attach)
  # name は source.disks[].name と紐付ける
  additional_disks:
    # - source_name: "data1"        # source.disks[].name を参照
    #   device_name: "data1"        # /dev/disk/by-id/google-<device_name> としてゲストから見える
    #   type: "pd-balanced"
    #   size_gb: 100                # 元 VMDK より大きくしたい場合のみ
    #   mode: "READ_WRITE"          # READ_WRITE / READ_ONLY
    #   auto_delete: false

  # サービスアカウント (未指定なら project の default compute SA)
  # service_account: "my-vm-sa@REPLACE_ME.iam.gserviceaccount.com"
  # scopes: ["cloud-platform"]

  # ラベル (任意)
  labels:
    env: "migrated"
    source: "vmware"

  # ネットワークタグ (FW ルールの target tag に紐付ける用)
  tags:
    - "ssh-allowed"

  # メタデータ (任意)
  # metadata:
  #   enable-oslogin: "TRUE"
  #   startup-script: |
  #     #!/bin/bash
  #     echo "hello" > /tmp/hello

# ------------------------------------------------------------------------------
# 5. ネットワーク設定
# ------------------------------------------------------------------------------
network:
  # 共有 VPC を使う場合は host_project を指定し、network/subnetwork は self-link 形式で書く
  host_project: "shingo-ar-sharedhost0926"

  # VPC ネットワーク名 (host_project 指定時は self-link でもよい)
  network: "shared-vpc"

  # サブネット名 (region 内)
  subnetwork: "subnet-svc1"

  # 内部 IP 設定
  internal_ip:
    # 指定方法:
    #   - "address_name": 予約済み compute address リソース名を使う
    #   - "ip": IP アドレス値を直接指定 (--private-network-ip)
    mode: "ip"

    # mode が "address_name" の場合に使う、予約済みアドレスのリソース名
    address_name: "centos8-internal-ip"

    # mode が "ip" の場合に使う、固定 IP アドレス値
    # ip: "10.0.0.10"
    ip: 10.100.1.201

  # 外部 IP は付けない (内部のみ)
  external_ip:
    enabled: false
    # enabled: true にした場合の設定
    # mode: "ephemeral"            # "ephemeral" or "static"
    # address_name: ""             # mode=static のときに使う予約済みアドレス名
    # network_tier: "PREMIUM"      # PREMIUM / STANDARD

# ------------------------------------------------------------------------------
# 6. ファイアウォールルール (任意・参考用)
# ------------------------------------------------------------------------------
# このスクリプトでは作成しないが、必要なら別途用意する想定。
# firewall:
#   - name: "allow-ssh-from-iap"
#     network: "REPLACE_ME-vpc"
#     source_ranges: ["35.235.240.0/20"]   # IAP TCP forwarding
#     target_tags: ["ssh-allowed"]
#     allow:
#       - protocol: "tcp"
#         ports: ["22"]
